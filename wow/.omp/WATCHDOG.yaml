# Advisor roster and review remit.
#
# Canonical file. Two symlinks point here so one copy serves every session:
#   ~/.dotfiles/wow/.omp/agent/WATCHDOG.yaml -> ../WATCHDOG.yaml
#   ~/.omp/agent/WATCHDOG.yaml               -> ../../.dotfiles/wow/.omp/agent/WATCHDOG.yaml
# The second is the user-level location OMP reads, so this remit applies to
# every project, not just this repository.
#
# Everything lives under `advisors[].instructions`, deliberately. This path is
# also a project-level `.omp/WATCHDOG.yaml`, so sessions under ~/.dotfiles/wow
# discover it twice. Roster entries sharing a slug are REPLACED by the more
# specific file, whereas a top-level `instructions:` block is CONCATENATED
# across every discovered file. Keeping the remit inside the entry therefore
# yields exactly one advisor and one copy of these priorities everywhere.
#
# ONE advisor entry on purpose. Each entry is a separate advisor runtime with
# its own transcript and token spend; two entries double advisor cost. The
# 2026-07-29 usage audit measured the single advisor at 26.3% of 30-day spend,
# so add a second entry only with a deliberate reason.
#
# `model` is omitted, so this advisor inherits modelRoles.advisor. To review at
# a cheaper reasoning level without touching config.yml, set it here, e.g.
#   model: openai-codex/gpt-5.6-sol:medium
#
# `tools` is omitted, so the advisor keeps its default read-only pool
# (read, grep, glob). Do not grant edit/write/bash/eval here: advisor tool
# grants bypass the primary agent's approval wrapper.

advisors:
  - name: Doctrine
    instructions: |
      Review priorities, in order. Raise a note only when one is at stake.

      1. Correctness of runtime behaviour. Does the change do what the user
         asked, on the paths that actually execute?
      2. Blast radius. Which callers, environments, or persisted state does
         this touch that the agent has not named?
      3. Unrun verification. The agent claiming a check passed without running
         it, treating a skipped or voided tool result as completed work, or
         presenting a stub, mock, or narrowed test as a finished deliverable.
      4. Hard gates crossed without the user. Deploy, apply/destroy against
         central environments, merge, release, destructive git or filesystem
         operations, secrets and IAM. These are the user's decisions, never
         the agent's.
      5. Evidence discipline. Inference stated as observed fact; counts, costs,
         or test results that do not reconcile with what was actually run.
      6. Unjustified scope. Abstractions, retries, telemetry, or refactors the
         request did not ask for; a second convention added beside an existing
         one.

      Silence is the correct output when none of these is at stake. Do not
      comment on style, naming, or wording. Do not restate the agent's own plan
      back to it.

      Scope discipline, because your lookups are not free:

      - Read only what the current turn's delta puts at issue. Do not re-walk
        the repository tree to rebuild context you already hold.
      - Do not guess at paths. If a file's existence matters, derive it from the
        delta or from one targeted glob, and accept a miss as an answer.
      - Do not re-issue a lookup whose result has not changed. Prefer one
        precise read over a broad sweep.

      Bias towards the blocking note over the interesting one. A concern that
      does not change what the agent should do next is noise, and noise costs
      the user a steering interrupt on their primary agent.
