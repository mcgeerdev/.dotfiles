# attentiond
#
# Stowed from ~/.dotfiles/wow/.attn to ~/.attn, which is where attentiond looks
# unless $ATTENTIOND_CONFIG or --config says otherwise.
#
# Every key here has a default, so this file only needs to say what differs.
# Unknown keys fail startup rather than being ignored.
#
#   Herdr / OMP ─┐
#   shell / tofu ─┤
#   GitHub ───────┤──▶ attentiond ──▶ Dynacat
#   future tools ─┘
#
# Sources that poll get a table. Anything that reports its own lifecycle
# (command wrappers, tofu runs, CI) posts to /api/events and needs no
# configuration beyond [events].

[daemon]
addr = "127.0.0.1:7717"
log_level = "info"
log_format = "text"

[attention]
# How long finished work stays in the Attention block. It keeps appearing in
# the full board below it. Herdr only retires a done pane when you focus it, so
# without this a finished agent you never clicked sits at the top of the queue
# for as long as the pane is open.
done_ttl = "10m"

# How old is too old. Past this an item leaves the Attention block, the Pull
# requests board and All work, and appears only under Stale. The clock is the
# item's own: for a pull request it is the last push, review or comment, so a
# month here means a month of nobody touching the work.
#
# Bump pulls one back out, and exempts it until you clear the bump.
stale_after = "720h"    # 30 days

# What the Snooze button on each item offers. Half a working day: long enough
# that the item is gone while you do the thing you chose instead, back before
# you go home. A single click can override it with ?for=, which nothing on the
# dashboard does yet.
snooze_for = "4h"

# Labels that go above every rank a source sets for itself, including a meeting
# about to start. A saved tofu plan nobody has approved is the case: the lock is
# released, but until the apply runs the change is not in, and forgetting about
# it costs more than any pull request on the board.
top_labels = ["waiting for approval"]

[events]
# How long finished or failed work posted to /api/events stays on screen.
ttl = "1h"

[notify]
# Interruptions. Herdr is silent by config (`[ui.toast] delivery = "off"` in
# ~/.wow/herdr/config.toml), so this daemon owns every popup on this machine.
enabled = true

# macOS Notification Center directly, through terminal-notifier. Not the herdr
# route: Herdr's [ui.toast] delivery is one switch over everything it shows,
# socket calls included, so silencing Herdr's own agent toasts would silence
# anything handed to it here.
route = "system"

# Worth hearing about without watching a tab. Only a change counts, and a
# repeat of the same label on the same item is suppressed for 15 minutes
# unless the item goes back to working in between, which is what makes a
# second finished agent turn inside that window still reach you.
#
# "done" and "blocked" are Herdr's own words for an agent that finished and one
# waiting on you, which is what makes this the OMP notifier now that Herdr no
# longer announces its own panes. They also cover commands run through
# attn-run: a finished `tofu apply` reports done under the same label.
#
# "waiting for approval" is posted by `attn-run --awaits-approval`, which the
# tofu shell wrapper passes for `plan -out=FILE`. That word has to match
# top_labels above and the one in ~/.wow/bin/attn-run.
labels = ["done", "blocked", "ready to merge", "checks running", "waiting for approval"]

[herdr]
enabled = true
poll = "2s"
# socket = ""    # default: Herdr's own resolution order
# fixture = ""   # replay a recorded `herdr api snapshot` instead of a live server

[github]
enabled = true
poll = "1m"

# What to watch. Empty means every repository the token can see, which is more
# than you want. Accounts and repositories union rather than intersect.
# orgs = ["didx-xyz"]
# mcgeerdev/.dotfiles is here for the weekly WOW release PR: it sits on the
# Pull requests board until you merge it.
repos = ["didx-xyz/tofu", "didx-xyz/mono", "mcgeerdev/.dotfiles"]

# Reviews owed here go to the top of the queue, above everything except a
# meeting about to start. tofu is the infrastructure authority repository: a
# review sitting in it blocks somebody else's deploy, which a review in mono
# usually does not.
priority_repos = ["didx-xyz/tofu"]

# A draft untouched for this long is reported as stale rather than plain draft.
stale_draft_after = "336h"

# Pull requests per search before the result is reported as incomplete. The
# warning reaches /api/work and /api/attention, so a capped list says so.
limit = 100

[calendar]
enabled = false
poll = "5m"
horizon = "12h"    # how far ahead the Meetings list looks
lead = "10m"       # a meeting this close moves into the attention queue

# One block per calendar. The address comes from url_env (a secret address,
# kept out of this public repo), from url, or is derived from the email, which
# only works for a calendar shared publicly.
[[calendar.feeds]]
label = "didx"
url_env = "ATTENTIOND_CALENDAR_DIDX"
