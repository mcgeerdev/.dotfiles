# Glance entrypoint. Pages live in their own files; this one holds the
# server-wide settings.
#
# No `server.host` here on purpose: Glance listens on all interfaces inside the
# container, and docker-compose.yml publishes the port on 127.0.0.1 only.
# Setting host to localhost would bind the container's own loopback and make the
# dashboard unreachable.

server:
  assets-path: /app/assets

theme:
  # Assets are cached by the browser; a CSS change needs a hard refresh
  # (Ctrl+F5 / Cmd+Shift+R) before it shows.
  custom-css-file: /assets/user.css

pages:
  - $include: home.yml
