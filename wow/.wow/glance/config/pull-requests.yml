# Pull requests, fed by attentiond's GitHub source.
#
# This reads /api/work rather than /api/attention on purpose: the section is the
# whole board, including the ones that are somebody else's turn. The subset that
# wants you already appears in the Attention widget above.
#
# The filter is a gjson query, so attentiond does the polling and GitHub
# credentials never come near Glance.

- type: custom-api
  title: Pull requests
  cache: 30s
  url: ${ATTENTIOND_URL}/api/work
  template: |
    {{ range .JSON.Array "warnings" }}
      {{ $warning := .String "" }}
      {{ if findMatch "^github:" $warning }}
        <p class="color-negative margin-bottom-10">{{ $warning }}</p>
      {{ end }}
    {{ end }}
    {{ $prs := .JSON.Array "items.#(source==\"github\")#" }}
    {{ if eq (len $prs) 0 }}
      <p class="color-paragraph">No open pull requests involve you.</p>
    {{ else }}
    <ul class="list list-gap-10 collapsible-container" data-collapse-after="8">
      {{ range $prs }}
      {{ $state := .String "state" }}
      <li class="flex items-center gap-10">
        <span class="size-h6 shrink-0 {{ if or (eq $state "needs_attention") (eq $state "failed") }}color-negative{{ else if eq $state "working" }}color-highlight{{ else }}color-paragraph{{ end }}">{{ .String "context.pr_state" }}</span>
        <a class="grow text-truncate color-highlight" href="{{ .String "context.url" }}" target="_blank">{{ .String "title" }}</a>
        <span class="size-h6 shrink-0 color-paragraph" {{ .String "updated_at" | parseTime "rfc3339" | toRelativeTime }}></span>
      </li>
      {{ end }}
    </ul>
    {{ end }}
