# Everything attentiond knows, in one list, from every source.
#
# Last on the page on purpose: the sections above are the ones that want a
# decision. This is the backstop, for when something is missing from them and
# you want to see what the daemon actually holds.

- type: custom-api
  title: All work
  cache: 5s
  url: ${ATTENTIOND_URL}/api/work
  template: |
    {{ $items := .JSON.Array "items" }}
    {{ if eq (len $items) 0 }}
      <p class="color-paragraph">Nothing in flight.</p>
    {{ else }}
    <ul class="list list-gap-10 collapsible-container" data-collapse-after="8">
      {{ range $items }}
      {{ $attention := .Bool "attention" }}

      {{/* What kind of work this is. Herdr panes and shell commands are both
           terminal but mean different things: one is an agent waiting on you,
           the other a command that ran. An unknown source falls back to its
           own name rather than a blank column. */}}
      {{ $source := .String "source" }}
      {{ $kind := $source }}
      {{ if eq $source "herdr" }}{{ $kind = "AGENT" }}{{ end }}
      {{ if eq $source "github" }}{{ $kind = "PR" }}{{ end }}
      {{ if eq $source "calendar" }}{{ $kind = "CAL" }}{{ end }}
      {{ if eq $source "shell" }}{{ $kind = "TERM" }}{{ end }}

      {{/* The word for why it is here, from whichever source knows one. */}}
      {{ $label := .String "context.pr_state" }}
      {{ if eq $label "" }}{{ $label = .String "context.phase" }}{{ end }}
      {{ if eq $label "" }}{{ $label = .String "state" }}{{ end }}

      <li class="flex items-center gap-10">
        <span class="size-h6 shrink-0 color-paragraph" style="display:inline-block;min-width:3.2rem">{{ $kind }}</span>
        <span class="size-h6 shrink-0 {{ if $attention }}color-negative{{ else if eq (.String "state") "working" }}color-highlight{{ else }}color-paragraph{{ end }}" style="display:inline-block;min-width:8.5rem">{{ $label }}</span>
        <span class="grow text-truncate {{ if $attention }}color-highlight{{ end }}">{{ .String "title" }}</span>
        <span class="size-h6 shrink-0 color-paragraph" {{ .String "updated_at" | parseTime "rfc3339" | toRelativeTime }}></span>
      </li>
      {{ end }}
    </ul>
    {{ end }}
